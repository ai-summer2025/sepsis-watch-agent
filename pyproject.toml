[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsiswatch"
version = "1.0.0"
description = "Sepsis screening and Sepsis-3 classification (SIRS, qSOFA, NEWS2, SOFA) with grounded LLM extraction from clinical notes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
sepsiswatch = "sepsiswatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
